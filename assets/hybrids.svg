<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1250" preserveAspectRatio="xMidYMid meet" width="1360" height="1250">
  <title>The hybrids: the 3 to 1 layer pattern, the two ways to wire it, and what the ratio buys on recall and memory</title>

  <!-- NODE REGISTRY (x, y, w, h)
       PANEL1  40 110 1280 280    48 bars w=20 h=84 at y=190, x = 72 + 24i    unit base x = 72 + 96u
       callout 72 336 1216 40
       PANEL2  40 410 1280 360    cardL 72 486 588 260    cardR 700 486 588 260
       seq stack 112 564/598/632/666 200 30      par: in 800 562 160 24 | A 740 614 180 32 | B 940 614 180 32 | sum (880,668) r13 | FFN 800 696 160 28
       PANEL3  40 790 1280 300    prompt 72 894 588 32   rows 72 938/982/1026 588 36
       bars right: label end x=880, bar x=896, rows y=908/950/992 h=26, scale 20px per GB
       PANEL4  cards w=392 h=76 y=1132 at x = 72 / 484 / 896
  -->

  <defs>
    <style>
