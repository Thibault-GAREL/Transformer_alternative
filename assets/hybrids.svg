  <rect x="0" y="0" width="1360" height="1250" fill="#FFFFFF"/>

  <!-- ============ TITLE ============ -->
  <text class="title" x="40" y="52">The hybrids, attention was rationed and not replaced</text>
  <text class="sub" x="40" y="76">Nobody ships pure. The only question left was the ratio, and in March 2026 three independent teams landed on the same one.</text>
  <line x1="40" y1="88" x2="196" y2="88" stroke="#EAB308" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ============ PANEL 1 : THE STACK ============ -->
  <rect x="40" y="110" width="1280" height="280" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="6,4"/>
  <circle cx="88" cy="136" r="13" fill="#3B82F6"/>
  <text class="mid b7" x="88" y="141" font-size="13" fill="#FFFFFF">1</text>
  <text class="sec" x="112" y="141">WHAT SHIPS IN 2026, LAYER BY LAYER</text>
  <text class="n12 end" x="1288" y="141">Qwen3-Next 80B-A3B, 48 layers</text>
  <text class="ssub" x="72" y="164">Read it left to right. Three cheap recurrent layers, then one softmax attention layer, twelve times over. The MoE feed-forward is identical in all 48.</text>

