  </g>

  <path d="M 72,282 L 72,292 L 164,292 L 164,282" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round"/>
  <text class="mid b sl" x="118" y="310" font-size="11">one unit</text>
  <rect x="180" y="284" width="46" height="20" rx="10" fill="#1E293B"/>
  <text class="mid b7" x="203" y="298" font-size="10" fill="#FFFFFF">× 12</text>

  <rect x="700" y="282" width="16" height="16" rx="3" fill="#CFFAFE" stroke="#0E7490" stroke-width="1.4"/>
  <text class="s11" x="724" y="295">Gated DeltaNet, 36 of them, each carries one fixed d × d state</text>
  <rect x="700" y="306" width="16" height="16" rx="3" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.4"/>
  <text class="s11" x="724" y="319">Gated attention, 12 of them, each carries a KV cache that grows</text>

  <rect x="72" y="336" width="1216" height="40" rx="10" fill="#FEF9C3" stroke="#EAB308" stroke-width="1.5"/>
  <text class="b ye" x="92" y="361" font-size="12">Those twelve layers do the exact lookups for the whole stack. The other thirty six carry cheap state, and that closes 97.4% of the recall gap to full attention.</text>

  <!-- ============ PANEL 2 : TWO WIRINGS ============ -->
  <rect x="40" y="410" width="1280" height="360" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="6,4"/>
  <circle cx="88" cy="436" r="13" fill="#8B5CF6"/>
  <text class="mid b7" x="88" y="441" font-size="13" fill="#FFFFFF">2</text>
  <text class="sec" x="112" y="441">TWO WAYS TO PUT BOTH MIXERS IN ONE MODEL</text>
  <text class="ssub" x="72" y="464">Same ingredients, different wiring. One alternates whole layers, the other runs both mixers inside a single block and adds their outputs.</text>

  <!-- left : sequential -->
  <rect x="72" y="486" width="588" height="260" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4" filter="url(#sh-sm)"/>
  <rect x="92" y="502" width="230" height="24" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.2"/>
  <text class="mid b cy" x="207" y="518" font-size="11">SEQUENTIAL INTERLEAVING</text>
  <text class="s11" x="92" y="548">Qwen3-Next, Nemotron 3 Nano. Whole layers alternate.</text>

  <path d="M 100,562 L 100,694" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar-sl)"/>
  <rect x="112" y="564" width="204" height="30" rx="7" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.3"/>
  <text class="mid b cy" x="214" y="584" font-size="11">Gated DeltaNet  +  MoE</text>
  <rect x="112" y="598" width="204" height="30" rx="7" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.3"/>
  <text class="mid b cy" x="214" y="618" font-size="11">Gated DeltaNet  +  MoE</text>
  <rect x="112" y="632" width="204" height="30" rx="7" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.3"/>
  <text class="mid b cy" x="214" y="652" font-size="11">Gated DeltaNet  +  MoE</text>
  <rect x="112" y="666" width="204" height="30" rx="7" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <text class="mid b bl" x="214" y="686" font-size="11">Gated attention  +  MoE</text>

  <text class="b cy" x="336" y="580" font-size="11">3 layers, one fixed state each</text>
  <text class="b bl" x="336" y="600" font-size="11">1 layer, one KV cache</text>
  <text class="s11" x="336" y="628">The stack stays 48 layers deep,</text>
  <text class="s11" x="336" y="646">exactly like a transformer.</text>
  <text class="s11" x="336" y="674">Cheapest in memory, and the</text>
  <text class="s11" x="336" y="692">wiring three teams converged on.</text>
  <text class="s11" x="92" y="726">Every block still has one mixer and one feed-forward. Only the colour of the mixer changes.</text>

  <!-- right : parallel -->
  <rect x="700" y="486" width="588" height="260" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4" filter="url(#sh-sm)"/>
  <rect x="720" y="502" width="230" height="24" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.2"/>
  <text class="mid b vi" x="835" y="518" font-size="11">PARALLEL HYBRID</text>
  <text class="s11" x="720" y="548">Falcon-H1. Both mixers see the same input, inside one block.</text>

  <rect x="800" y="562" width="160" height="24" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.3"/>
  <text class="mid b" x="880" y="579" font-size="11" fill="#9A3412">input to the block</text>

  <path d="M 880,586 L 880,598 Q 880,606 872,606 L 838,606 Q 830,606 830,612" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar-sl)"/>
  <path d="M 880,586 L 880,598 Q 880,606 888,606 L 1022,606 Q 1030,606 1030,612" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar-sl)"/>

  <rect x="740" y="614" width="180" height="32" rx="8" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.4"/>
  <text class="mid b cy" x="830" y="635" font-size="11">Mamba-2</text>
  <rect x="940" y="614" width="180" height="32" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text class="mid b bl" x="1030" y="635" font-size="11">Softmax attention</text>

  <path d="M 830,646 L 830,660 Q 830,668 838,668 L 865,668" fill="none" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#ar-cy)"/>
  <path d="M 1030,646 L 1030,660 Q 1030,668 1022,668 L 895,668" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#ar-bl)"/>
  <circle cx="880" cy="668" r="13" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text class="mid b sl" x="880" y="674" font-size="16">+</text>

  <path d="M 880,681 L 880,692" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#ar-vi)"/>
  <rect x="800" y="696" width="160" height="28" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.4"/>
  <text class="mid b vi" x="880" y="715" font-size="11">MoE feed-forward</text>

  <text class="s11" x="1140" y="626">both run on</text>
  <text class="s11" x="1140" y="644">the same input</text>
  <text class="s11" x="1140" y="672">and are summed</text>

  <text class="s11" x="720" y="742">A shorter critical path, since both mixers run at once. It pays for that by carrying both memories in every block.</text>

  <!-- ============ PANEL 3 : WHY IT WORKS ============ -->
  <rect x="40" y="790" width="1280" height="300" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="6,4"/>
  <circle cx="88" cy="816" r="13" fill="#EAB308"/>
  <text class="mid b7" x="88" y="821" font-size="13" fill="#FFFFFF">3</text>
  <text class="sec" x="112" y="821">WHY A HANDFUL OF ATTENTION LAYERS IS ENOUGH</text>
  <text class="ssub" x="72" y="844">A fixed state does not degrade slowly, it fails once it is full. One attention layer does the exact lookup that the other thirty six cannot do at all.</text>

  <text class="b sl" x="72" y="880" font-size="11">MULTI-QUERY ASSOCIATIVE RECALL, THE TEST THAT SEPARATES THEM</text>
  <rect x="72" y="894" width="588" height="32" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text class="mono mid" x="366" y="915" font-size="11" fill="#334155">… alice → 42 … bob → 17 … carol → 99 …   what is bob?</text>

  <rect x="72" y="938" width="588" height="36" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.4"/>
  <circle cx="94" cy="956" r="10" fill="#10B981"/>
  <text class="mid b7" x="94" y="961" font-size="12" fill="#FFFFFF">✓</text>
  <text class="n12" x="114" y="960">full attention</text>
  <text class="s11" x="278" y="960">looks the position up directly, correct at any depth</text>

  <rect x="72" y="982" width="588" height="36" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.4"/>
  <circle cx="94" cy="1000" r="10" fill="#EF4444"/>
  <text class="mid b7" x="94" y="1005" font-size="12" fill="#FFFFFF">✗</text>
  <text class="n12" x="114" y="1004">fixed state, 64 slots</text>
  <text class="s11" x="278" y="1004">correct until the 64th pair, then it starts guessing</text>

  <rect x="72" y="1026" width="588" height="36" rx="8" fill="#FEF9C3" stroke="#EAB308" stroke-width="1.6"/>
  <circle cx="94" cy="1044" r="10" fill="#EAB308"/>
  <text class="mid b7" x="94" y="1049" font-size="12" fill="#FFFFFF">✓</text>
  <text class="n12" x="114" y="1048">hybrid, 1 attention layer</text>
  <text class="s11" x="278" y="1048">that single layer does the lookup for all the others</text>

  <text class="b sl" x="700" y="880" font-size="11">WHAT THE RATIO COSTS, KV CACHE AT 32 K TOKENS</text>

  <text class="end n12" x="880" y="925">full attention</text>
  <rect x="896" y="908" width="320" height="26" rx="5" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.3"/>
  <text class="b rd" x="1224" y="925" font-size="12">16 GB</text>

  <text class="end n12" x="880" y="967">hybrid, 1 in 4</text>
  <rect x="896" y="950" width="80" height="26" rx="5" fill="#FEF9C3" stroke="#EAB308" stroke-width="1.5"/>
  <text class="b ye" x="984" y="967" font-size="12">4 GB</text>

  <text class="end n12" x="880" y="1009">pure recurrent</text>
  <rect x="896" y="992" width="4" height="26" rx="2" fill="#ECFDF5" stroke="#10B981" stroke-width="1.3"/>
  <text class="b gr" x="908" y="1009" font-size="12">0.13 GB</text>

  <text class="s11" x="700" y="1046">GQA divides that bill by a constant. A recurrent state flattens it entirely.</text>
  <text class="s11" x="700" y="1064">One is a smaller factor, the other is a change of exponent, and the hybrid buys back the recall.</text>

  <!-- ============ PANEL 4 : CONVERGENCE ============ -->
  <text class="b" x="72" y="1118" font-size="11" fill="#94A3B8">MARCH 2026, THREE TEAMS, NO COORDINATION, ONE ANSWER, ROUGHLY 75% LINEAR AND 25% SOFTMAX ATTENTION PLUS A SPARSE MOE</text>

  <rect x="72" y="1132" width="392" height="76" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4" filter="url(#sh-sm)"/>
  <rect x="72" y="1132" width="5" height="76" rx="2.5" fill="#10B981"/>
  <text class="n12" x="92" y="1157">NVIDIA Nemotron 3 Nano</text>
  <text class="s11" x="92" y="1178">mostly Mamba-2 layers, a few softmax</text>
  <text class="s11" x="92" y="1196">attention layers, sparse MoE throughout</text>

  <rect x="484" y="1132" width="392" height="76" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4" filter="url(#sh-sm)"/>
  <rect x="484" y="1132" width="5" height="76" rx="2.5" fill="#3B82F6"/>
  <text class="n12" x="504" y="1157">Qwen 3.5</text>
  <text class="s11" x="504" y="1178">Gated DeltaNet three to one against</text>
  <text class="s11" x="504" y="1196">gated attention, sparse MoE throughout</text>

